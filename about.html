
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Creator | CODEX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #090911;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 650px;
    text-align: center;
}

.logo {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 40px;
}

.logo span {
    color: #a78bfa;
}

.card {
    background: linear-gradient(145deg, #171522, #10101a);
    border: 1px solid #302747;
    border-radius: 25px;
    padding: 45px 25px;
    box-shadow: 0 15px 60px #0008;
}

.avatar {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #7946dc, #28204a);
    font-size: 40px;
    font-weight: 900;
    box-shadow: 0 0 35px #9565f555;
}

.tag {
    display: inline-block;
    margin-top: 28px;
    padding: 6px 17px;
    border: 1px solid #7952bd;
    border-radius: 30px;
    color: #b99bff;
    font-size: 11px;
    letter-spacing: 2px;
}

h1 {
    font-size: 38px;
    margin-top: 12px;
    letter-spacing: 3px;
}

h1 span {
    color: #a78bfa;
}

.subtitle {
    color: #a78bfa;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-top: 5px;
}

.description {
    color: #aaa7b8;
    line-height: 2;
    font-size: 14px;
    margin-top: 25px;
}

.divider {
    height: 1px;
    background: #302747;
    margin: 30px 0;
}

.info {
    display: flex;
    justify-content: space-around;
    gap: 15px;
}

.info div {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.info strong {
    color: #b99bff;
    font-size: 17px;
}

.info small {
    color: #858195;
}

.version {
    color: #777386;
    font-size: 11px;
    margin-top: 30px;
    letter-spacing: 2px;
}

.back {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 30px;
    border-radius: 12px;
    background: #8054dc;
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: .3s;
}

.back:hover {
    background: #9b72f2;
    transform: translateY(-3px);
}

.credit {
    color: #777386;
    font-size: 11px;
    letter-spacing: 3px;
    margin-top: 35px;
}

.credit span {
    color: #b99bff;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">CODE<span>X</span></div>

    <div class="card">

        <div class="avatar">S</div>

        <div class="tag">FOUNDER & DEVELOPER</div>

        <h1>SH<span>ADY</span></h1>

        <p class="subtitle">THE CREATOR OF CODEX</p>

        <p class="description">
            أهلاً بيك في CODEX.
            <br>
            مشروع تعليمي هدفه تبسيط البرمجة
            ومساعدة المبتدئين على تعلم البرمجة
            وبناء مشاريعهم خطوة بخطوة.
        </p>

        <div class="divider"></div>

        <div class="info">

            <div>
                <strong>CODEX</strong>
                <small>Platform</small>
            </div>

            <div>
                <strong>1.0</strong>
                <small>Version</small>
            </div>

            <div>
                <strong>SHADY</strong>
                <small>Creator</small>
            </div>

        </div>

    </div>

    <a href="index.html" class="back">
        العودة إلى CODEX ←
    </a>

    <p class="credit">
        CREATED BY <span>SHADY</span>
    </p>

    <p class="version">© 2026 CODEX. ALL RIGHTS RESERVED.</p>

</div>

</body>
</html>
