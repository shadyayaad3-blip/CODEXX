<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CODEX | حسابي</title>
<script src="auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="profile.css">
</head><body>
<header class="topbar"><a class="brand" href="index.html">CODE<span>X</span></a><nav><a href="index.html">الرئيسية</a><a href="playground.html">ساحة التجربة</a></nav></header>
<main class="wrap pf">
  <section class="box"><h1 id="hello">حسابي</h1><p id="mail" class="muted"></p>
    <div class="stats3"><div><strong id="pXP">0</strong><span>نقاط XP</span></div><div><strong id="pDone">0</strong><span>درس مكتمل</span></div><div><strong id="pStreak">0</strong><span>يوم متتالي</span></div></div></section>
  <section class="box"><h2>تقدمي في المسارات</h2><div id="courses"></div></section>
  <section class="box"><h2>تعديل الاسم</h2><div class="row"><input id="newName" placeholder="الاسم الجديد"><button class="b" id="saveName">حفظ</button></div></section>
  <section class="box"><h2>تغيير كلمة المرور</h2><div class="col"><input id="oldPw" type="password" dir="ltr" placeholder="كلمة المرور الحالية" autocomplete="current-password"><input id="newPw" type="password" dir="ltr" placeholder="كلمة المرور الجديدة (8 حروف+)" autocomplete="new-password"><button class="b" id="savePw">تغيير</button></div></section>
  <section class="box"><h2>نسخة احتياطية للتقدم</h2><p class="muted">بياناتك محفوظة في المتصفح فقط. صدّر نسخة عشان تنقلها لجهاز تاني أو تحتفظ بيها.</p><div class="row"><button class="b" id="exp">⬇ تصدير التقدم</button><label class="b ghost">⬆ استيراد<input id="imp" type="file" accept=".json" hidden></label></div></section>
  <p id="pmsg" class="msg" role="status"></p>
  <section class="box danger"><h2>منطقة الخطر</h2><div class="row"><button class="b ghost" id="out">تسجيل الخروج</button><button class="b red" id="del">حذف حسابي نهائيًا</button></div></section>
</main><script src="course-data.js"></script><script src="labs.js"></script><script src="profile.js"></script></body></html>
